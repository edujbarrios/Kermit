name: PowerShell CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path . -Recurse -File |
            Where-Object { $_.Extension -in @('.ps1', '.psm1') }
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName, [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "$($file.FullName): $_" }
              throw "Parse errors in $($file.FullName)"
            }
          }

      - name: Run pure smoke tests
        shell: pwsh
        run: ./tests/Smoke.Tests.ps1

      - name: Test cleanup in isolated temp directory
        shell: pwsh
        run: ./tests/Cleanup.Tests.ps1

      - name: Test AI Doctor (read-only)
        shell: pwsh
        run: |
          ./tests/AIDoctor.Tests.ps1
          $report = (& ./AI-Doctor.ps1 -Json) | ConvertFrom-Json
          if (-not $report.Report.ReadOnly -or $report.Report.SchemaVersion -ne 1) {
            throw 'AI Doctor report schema or read-only status invalid.'
          }
          if ($report.Report.DeepCheck.Requested) { throw 'Deep CUDA probe must be opt-in.' }

      - name: Test benchmark snapshots and comparison
        shell: pwsh
        run: |
          ./tests/Benchmark.Tests.ps1
          $destination = Join-Path $env:RUNNER_TEMP 'kermit-benchmark-fixture'
          $before = (& ./Benchmark.ps1 -Action Capture -Label Before -Directory $destination -Json) | ConvertFrom-Json
          $after = (& ./Benchmark.ps1 -Action Capture -Label After -Directory $destination -Json) | ConvertFrom-Json
          if ($before.Snapshot.Schema -ne 'kermit.benchmark.v1') { throw 'Capture failed.' }
          $comparison = (& ./Benchmark.ps1 -Action Compare -BeforePath $before.Path -AfterPath $after.Path -Json) | ConvertFrom-Json
          if ($comparison.Result.Schema -ne 'kermit.benchmark-comparison.v1') { throw 'Compare failed.' }
          if ($comparison.Result.Metrics.Count -lt 4) { throw 'Missing comparison metrics.' }

      - name: Exercise cleanup read-only CLI
        shell: pwsh
        run: |
          $inventory = (& ./Cleanup.ps1 -Action Inventory -Json) | ConvertFrom-Json
          if ($inventory.Action -ne 'Inventory') { throw 'Cleanup inventory failed.' }
          $plan = (& ./Cleanup.ps1 -Action Plan -Target Temp -Json) | ConvertFrom-Json
          if ($plan.Action -ne 'Plan' -or $plan.Plan.Target -ne 'Temp') {
            throw 'Cleanup plan failed.'
          }
          $rejected = $false
          try { & ./Cleanup.ps1 -Action Apply -Target Temp -ErrorAction Stop 2>$null | Out-Null } catch { $rejected = $true }
          if (-not $rejected) { throw 'Cleanup mutation without approval was accepted.' }

      - name: Exercise read-only CLI
        shell: pwsh
        run: |
          $scan = (& ./Kermit.ps1 -Action Scan -Json) | ConvertFrom-Json
          if ($scan.Action -ne 'Scan' -or $scan.Inventory.SchemaVersion -ne 1) {
            throw 'Scan JSON schema check failed.'
          }
          $plan = (& ./Kermit.ps1 -Action Plan -Profile AI-Training -Json) | ConvertFrom-Json
          if ($plan.Action -ne 'Plan' -or $plan.Plan.Profile -ne 'AI-Training') {
            throw 'Plan JSON schema check failed.'
          }

      - name: Validate WPF GUI without displaying windows
        shell: powershell
        run: |
          $result = & powershell.exe -NoProfile -STA -File .\\Kermit-GUI.ps1 -ValidateXaml
          if ($LASTEXITCODE -ne 0 -or ($result -join ' ') -notmatch 'Kermit WPF XAML validated') {
            throw 'WPF XAML validation failed.'
          }

      - name: Smoke-test WPF read-only preview buttons
        shell: powershell
        timeout-minutes: 2
        run: |
          $result = & powershell.exe -NoProfile -STA -File .\\Kermit-GUI.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0 -or ($result -join ' ') -notmatch 'Kermit read-only GUI event smoke tests passed') {
            throw 'WPF GUI read-only button tests failed.'
          }

      - name: Verify Windows PowerShell 5.1 compatibility
        shell: powershell
        run: |
          .\tests\Smoke.Tests.ps1
          .\tests\Cleanup.Tests.ps1
          .\tests\AIDoctor.Tests.ps1
          .\tests\Benchmark.Tests.ps1
          $path = Join-Path $env:RUNNER_TEMP 'kermit-benchmark-ps51'
          $report = (& .\Benchmark.ps1 -Action Capture -Label Before -Directory $path -Json) | ConvertFrom-Json
          if ($report.Snapshot.Schema -ne 'kermit.benchmark.v1') { throw 'PowerShell 5.1 benchmark failed.' }
          $doctor = (& .\AI-Doctor.ps1 -Json) | ConvertFrom-Json
          if (-not $doctor.Report.ReadOnly) { throw 'AI Doctor CLI failed in PowerShell 5.1.' }
          $scan = (& .\Kermit.ps1 -Action Scan -Json) | ConvertFrom-Json
          if ($scan.Action -ne 'Scan' -or $scan.Inventory.SchemaVersion -ne 1) {
            throw 'Windows PowerShell 5.1 scan failed.'
          }
